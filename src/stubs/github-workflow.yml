name: Warden Security Audit

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  warden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f # immutable pin, reviewed 2026-07-10

      - name: Set up PHP
        uses: shivammathur/setup-php@93f351c169514bd9f4630bd31dd63fde23a79f9f # immutable pin, reviewed 2026-07-10
        with:
          php-version: '{{PHP_VERSION}}'
          tools: composer:v2
          coverage: none

      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # immutable pin, reviewed 2026-07-10
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}

      - name: Install development dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run Warden
        run: php artisan warden:audit --format=github --report=json:warden.json --report=sarif:warden.sarif --report=junit:warden-junit.xml

      - name: Retain Warden reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: warden-reports
          path: |
            warden.json
            warden.sarif
            warden-junit.xml
          retention-days: 14

      - name: Warden summary
        if: always()
        shell: bash
        run: |
          php -r '$p = "warden.json"; if (!is_file($p)) { echo "Warden: report unavailable; inspect the job log.\n"; exit; } $r = json_decode(file_get_contents($p), true, 512, JSON_THROW_ON_ERROR); printf("## Warden\nStatus: %s; gate exit: %d\n\n%d blocking, %d advisory, %d errors. See annotations and retained reports.\n", $r["run"]["status"], $r["gate"]["exit_code"], $r["summary"]["blocking"], $r["summary"]["advisory"], $r["summary"]["errors"]);' >> "$GITHUB_STEP_SUMMARY"

      # Optional: enable the repository variable WARDEN_CODE_SCANNING and grant
      # this job security-events: write after reviewing your repository policy.
      # Fork PRs and repositories without code scanning retain annotations/artifacts.
      - name: Upload SARIF to code scanning (opt-in)
        if: always() && vars.WARDEN_CODE_SCANNING == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@cf12ceefebab2c867b9c35d7f907e059681d37ab # v3
        with:
          sarif_file: warden.sarif
