name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tag and notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          test -s "docs/releases/$RELEASE_TAG.md"

      - name: Verify CI passed for the release commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow tests.yml --branch main --event push --commit "$GITHUB_SHA" --limit 1 --json status,conclusion)"
          jq -e 'length == 1 and .[0].status == "completed" and .[0].conclusion == "success"' <<< "$runs"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --latest \
            --title "Warden ${RELEASE_TAG#v}" \
            --notes-file "docs/releases/$RELEASE_TAG.md"
